<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Plantilla de correo masivo</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; display: flex; height: 100vh; }
  .panel { width: 45%; padding: 1.5rem; box-sizing: border-box; overflow-y: auto; background: #f7f7f8; }
  .preview { width: 55%; padding: 2rem; overflow-y: auto; background: white; border-left: 1px solid #ddd; }
  input, textarea { width: 100%; padding: 0.5rem; font-family: inherit; box-sizing: border-box; margin-bottom: 1rem; }
  label { font-weight: bold; display: block; margin-top: 0.5rem; }
  button { padding: 0.6rem 1rem; cursor: pointer; border: none; border-radius: 6px; background: #1a1a1a; color: white; }
  .aviso { background: #fff3cd; padding: 0.7rem; border-radius: 6px; font-size: 0.85rem; margin-bottom: 1rem; }
  .preview-box { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; }
  #estado { color: #157347; }
</style>
</head>
<body>
  <div class="panel">
    <h2>Plantilla de correo masivo</h2>
    <p class="aviso">Esta plantilla se aplica a <strong>todas</strong> las vacantes pendientes de envío.
    Usa <code>{cargo}</code> y <code>{empresa}</code> donde quieras que se reemplacen automáticamente.</p>

    <label>Asunto</label>
    <input id="asunto" value="{{ plantilla.asunto_tpl }}" oninput="actualizarPreview()">

    <label>Cuerpo</label>
    <textarea id="cuerpo" rows="10" oninput="actualizarPreview()">{{ plantilla.cuerpo_tpl }}</textarea>

    <label>Copia (CC) por defecto — opcional</label>
    <input id="cc" value="{{ plantilla.cc_default or '' }}" placeholder="correo@ejemplo.com">

    <button onclick="guardar()">Guardar plantilla</button>
    <p id="estado"></p>
  </div>

  <div class="preview">
    <h3>Vista previa (con datos de ejemplo)</h3>
    <div class="preview-box">
      <p><strong>Asunto:</strong> <span id="prev-asunto"></span></p>
      <p><strong>CC:</strong> <span id="prev-cc"></span></p>
      <p><strong>Cuerpo:</strong></p>
      <p id="prev-cuerpo" style="white-space: pre-wrap;"></p>
    </div>
  </div>

<script>
const EJEMPLO = { cargo: "Desarrollador Backend", empresa: "TechCorp S.A.S" };

function actualizarPreview() {
  const asunto = document.getElementById('asunto').value
    .replaceAll('{cargo}', EJEMPLO.cargo).replaceAll('{empresa}', EJEMPLO.empresa);
  const cuerpo = document.getElementById('cuerpo').value
    .replaceAll('{cargo}', EJEMPLO.cargo).replaceAll('{empresa}', EJEMPLO.empresa);
  document.getElementById('prev-asunto').innerText = asunto;
  document.getElementById('prev-cuerpo').innerText = cuerpo;
  document.getElementById('prev-cc').innerText = document.getElementById('cc').value || '(sin copia)';
}

async function guardar() {
  const body = {
    asunto_tpl: document.getElementById('asunto').value,
    cuerpo_tpl: document.getElementById('cuerpo').value,
    cc_default: document.getElementById('cc').value || null,
  };
  const res = await fetch('/api/plantilla-correo', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  document.getElementById('estado').innerText = res.ok ? 'Plantilla guardada.' : 'Error al guardar.';
}

actualizarPreview();
</script>
</body>
</html>
